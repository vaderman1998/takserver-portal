<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAK Server Portal &mdash; Login</title>
  <link rel="stylesheet" href="/static/css/style.css?v=6">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke="#60a5fa" stroke-width="3"/><path d="M24 10v28M10 24h28" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="24" r="6" fill="#60a5fa" opacity=".25"/></svg>
      </div>
      <h1>TAK Server Portal</h1>
      <p class="subtitle">Upgrade &amp; Certificate Management</p>
    </div>
    <div id="error-msg" class="error-msg" style="display:none">Invalid username or password</div>
    <div id="updated-msg" class="info-msg" style="display:none">The portal was updated and restarted. Sign in again.</div>
    <form method="POST" action="/login" autocomplete="on">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
  </div>
  <script>
    if (location.search.includes('error=1')) {
      document.getElementById('error-msg').style.display = 'block';
    }
    if (location.search.includes('updated=1')) {
      document.getElementById('updated-msg').style.display = 'block';
    }
  </script>
</body>
</html>
